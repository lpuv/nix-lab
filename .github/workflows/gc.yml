name: Cache GC

concurrency:
  group: hestia-gc
  cancel-in-progress: false

on:
  schedule:
    # Runs daily at 3:23 AM UTC
    - cron: "23 3 * * *"
  workflow_dispatch:
    inputs:
      dry-run:
        description: Plan only; do not repack, touch, or delete anything.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  gc:
    runs-on: ubuntu-latest
    permissions:
      # REST cache deletes need actions:write
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/nix-installer-action@main
      
      # downloads the hestia binary and sets the $HESTIA_BIN environment variable
      - uses: Mic92/hestia@v3
      
      # runs the actual garbage collection using that binary
      - name: Run garbage collection
        run: |
          "$HESTIA_BIN" gc ${{ inputs.dry-run && '--dry-run' || '' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
