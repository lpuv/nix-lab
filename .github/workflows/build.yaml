name: "Colmena build"
on:
  push:
    branches:
      - 'main'
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: Mic92/hestia@v3
      - run: nix develop --command colmena build --no-build-on-target # --evaluator=streaming
